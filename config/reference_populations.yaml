
# AADR v66.p1 HumanOrigins
# Population labels are preserved exactly as in AADR.
# Geographic categories are analysis-defined, not ancestry assignments.

reference_panel: compatibility_HO

selection:
  assessment: Pass
  date_bp: "0"
  data_type: HumanOrigins
  genetic_id_suffix: ".HO"
  exclude_label_patterns:
    - QCremove
    - "-Dup"
    - "-o"

  # Keep all eligible individuals initially.
  max_individuals_per_population: null

